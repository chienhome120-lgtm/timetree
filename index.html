<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日常樹｜多人共用行程</title>
<style>
:root{--bg:#eee9e2;--card:#faf7f2;--ink:#50534e;--muted:#8e8c84;--sage:#87988a;--sage2:#b3bdb2;--rose:#b9908e;--blue:#8999a6;--line:#ddd5cc;--red:#a56f6c;--shadow:0 10px 30px #514b4315}
*{box-sizing:border-box}body{margin:0;font-size:21px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.hidden{display:none!important}button,input,textarea{font:inherit}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#e9e2da,#dce3dc);z-index:99}.login{width:min(94vw,430px);background:var(--card);padding:25px 19px;border-radius:28px;box-shadow:var(--shadow);text-align:center}.logo{width:70px;height:70px;margin:auto;background:var(--sage);border-radius:23px;display:grid;place-items:center;font-size:37px}.login h1{margin:12px 0 4px}.login p{margin:0 0 18px;color:var(--muted);font-size:18px}.login input{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;margin:5px 0;background:#fff;outline:none}.primary{border:0;background:var(--sage);color:white;border-radius:14px;padding:12px 16px;font-weight:700}.login .primary{width:100%;margin-top:7px}.color-pick{display:flex;align-items:center;gap:9px;margin:7px 0;padding:8px 10px;background:#efebe5;border-radius:13px;font-size:18px}.color-pick input{width:42px!important;height:32px;padding:1px!important;margin:0!important}.color-pick small{color:var(--muted)}.err{height:18px;color:var(--red);font-size:17px;margin-top:7px}
#app{max-width:560px;margin:auto;padding:0 12px 100px}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:800}.user{font-size:17px;color:var(--muted)}.cal{height:62vh;min-height:430px;max-height:640px;background:var(--card);border-radius:25px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}.head{display:flex;align-items:center;justify-content:space-between}.head h2{font-size:26px;margin:0}.nav{display:flex;gap:6px}.nav button,.today{border:0;background:#e8e4de;border-radius:12px;padding:9px 12px;color:var(--ink)}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week{text-align:center;font-size:17px;color:var(--muted);padding:10px 0 5px}.grid{flex:1;grid-template-rows:repeat(6,1fr);gap:3px}.day{position:relative;border:0;background:transparent;border-radius:12px;text-align:left;padding:4px;color:var(--ink)}.day.other{opacity:.3}.day.sunday{background:#f2dddd;color:#8b6264}.day.saturday{background:#dce7dd;color:#5f7464}.day.sunday.sel{background:#eacfd0;box-shadow:inset 0 0 0 2px #d9b7b9}.day.saturday.sel{background:#cfddcf;box-shadow:inset 0 0 0 2px #aec4b0}.day.sel:not(.sunday):not(.saturday){background:#e0e7e0}.week div:first-child{background:#efd7d8;color:#8b6264;border-radius:9px;padding:5px 0}.week div:last-child{background:#d7e3d8;color:#5f7464;border-radius:9px;padding:5px 0}.num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700}.day.now .num{background:var(--sage);color:white}.day-events{position:absolute;left:3px;right:3px;top:35px;bottom:3px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day-event{display:block;width:100%;padding:2px 3px;border-radius:4px;background:var(--event-color,#87988a);color:white;text-shadow:0 1px 2px #0005;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


.more-event{font-size:13px;color:var(--muted);padding-left:2px;white-space:nowrap}
.lower{margin-top:12px;background:var(--card);border-radius:25px;padding:15px;box-shadow:var(--shadow);min-height:225px}.lowerhead{display:flex;justify-content:space-between;align-items:center}.lower h3{margin:0}.date{font-size:18px;color:var(--sage);font-weight:800}.tabs{display:flex;gap:6px;margin:11px 0}.tab{flex:1;border:0;border-radius:11px;padding:9px;background:#e9e5df;color:var(--muted);font-weight:700}.tab.on{background:var(--sage2);color:white}.panel{display:none}.panel.on{display:block}.empty{text-align:center;color:var(--muted);font-size:18px;padding:20px 4px}.item{background:#efebe5;border-radius:12px;margin:7px 0;padding:9px 10px;display:flex;gap:8px;align-items:center;border-left:5px solid var(--sage)}.grow{flex:1;min-width:0}.item b{font-size:19px}.meta{font-size:16px;color:var(--muted);margin-top:3px}.del{border:0;background:transparent;color:var(--red);font-size:25px}.addrow{display:flex;gap:7px}.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px}.small{border:0;background:var(--sage);color:white;border-radius:12px;padding:0 14px}.note{width:100%;height:110px;border:1px solid var(--line);border-radius:13px;padding:11px;resize:vertical}.fab{position:fixed;right:max(20px,calc((100vw - 540px)/2));bottom:24px;width:58px;height:58px;border:0;border-radius:50%;background:var(--rose);color:white;font-size:35px;box-shadow:0 8px 22px #74504e40}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#4f544f;color:#fff;padding:7px 13px;border-radius:18px;font-size:17px;z-index:50;opacity:0;pointer-events:none;transition:.2s}.status.show{opacity:1}
.modal{position:fixed;inset:0;background:#3335;z-index:80;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,560px);background:var(--card);border-radius:25px 25px 0 0;padding:20px 18px 28px}.field{margin:9px 0}.field label{display:block;font-size:17px;color:var(--muted);margin-bottom:4px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:white}.field textarea{height:70px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;border:0;border-radius:13px;padding:12px}.cancel{background:#e8e2db}
/* 字級增大後的手機排版補強 */
.login{max-height:95dvh;overflow-y:auto}
.cal{min-height:490px}
.day{min-width:0;padding:3px}
.num{width:29px;height:29px}
.day-event{padding:2px 2px}
.sheet{max-height:92dvh;overflow-y:auto;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.field input,.field textarea,.login input{min-height:48px}
@media(max-width:390px){.cal{padding:9px}.grid{gap:2px}.day{padding:2px}.day-event{font-size:12px}.more-event{font-size:11px}}
/* 行李箱密碼轉盤：三個獨立直向滾輪 */
.luggage-time{background:linear-gradient(145deg,#e6e3dc,#f3efe9);border:1px solid var(--line);border-radius:18px;padding:12px 10px 10px;box-shadow:inset 0 2px 6px #4d46331a}
.wheel-caption{font-size:15px;color:var(--muted);text-align:center;margin-bottom:7px}
.wheel-row{display:flex;align-items:center;justify-content:center;gap:7px}
.wheel-unit{flex:1;min-width:0}.wheel-label{text-align:center;font-size:15px;color:#6e766f;margin-bottom:6px}
.wheel{height:156px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;border:2px solid #b9b6ae;border-radius:13px;background:linear-gradient(to bottom,#e6e4de 0%,#fafaf7 34%,#fff 45%,#fff 55%,#fafaf7 66%,#e6e4de 100%);box-shadow:inset 0 5px 9px #0002,0 3px 4px #fff8;scrollbar-width:none;position:relative;touch-action:pan-y}
.wheel::-webkit-scrollbar{display:none}
.wheel::after{content:"";position:sticky;display:block;bottom:52px;height:52px;margin-top:-52px;border-top:2px solid #87988a66;border-bottom:2px solid #87988a66;pointer-events:none}
.wheel-option{height:52px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:26px;font-weight:750;color:#8c8d87;user-select:none;cursor:pointer;transition:color .12s}
.wheel-option.active{color:#394e43;font-size:30px;text-shadow:0 1px 0 #fff}
.wheel-spacer{height:52px;pointer-events:none}
.wheel-colon{font-size:31px;font-weight:800;color:var(--sage);padding-top:20px}
.wheel-preview{text-align:center;color:#617568;font-size:18px;font-weight:700;margin-top:9px}
@media(max-width:380px){.wheel-row{gap:4px}.wheel-option{font-size:23px}.wheel-option.active{font-size:27px}.luggage-time{padding:9px 6px}}

/* 登入字卡在不同手機寬度下維持水平置中 */
#login{box-sizing:border-box;width:100%;max-width:100vw;margin:0;justify-items:center;align-items:center;padding-left:16px;padding-right:16px}
#login .login{box-sizing:border-box;width:100%;max-width:430px;margin-left:auto;margin-right:auto;justify-self:center;transform:none}
@media(max-width:480px){#login{padding-left:16px;padding-right:16px}#login .login{max-width:100%}}
</style>
</head><body>
<section id="login"><div class="login"><div class="logo">🌿</div><h1>日常樹</h1><p>多人共用行程・大家都能新增與刪除</p><input id="name" placeholder="你的名稱（例如：David）" maxlength="20"><div class="color-pick"><span>我的代表色</span><input id="userColor" type="color" value="#87988a"><small>行程使用此顏色</small></div><input id="pass" type="password" inputmode="numeric" maxlength="4" placeholder="登入密碼"><button id="loginBtn" class="primary">進入共用行事曆</button><div id="err" class="err"></div></div></section>
<main id="app" class="hidden"><header class="top"><div><div class="brand">日常樹</div><div id="who" class="user"></div></div><button id="today" class="today">今天</button></header>
<section class="cal"><div class="head"><h2 id="month"></h2><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div id="grid" class="grid"></div></section>
<section class="lower"><div class="lowerhead"><h3>共用記事</h3><span id="date" class="date"></span></div><div class="tabs"><button class="tab on" data-p="events">行程</button><button class="tab" data-p="todos">待辦</button><button class="tab" data-p="notes">備註</button></div>
<div id="events" class="panel on"></div>
<div id="todos" class="panel"><div class="addrow"><input id="todoText" placeholder="新增共用待辦…"><button id="addTodo" class="small">＋</button></div><div id="todoList"></div></div>
<div id="notes" class="panel"><div class="addrow"><input id="noteText" placeholder="新增一則共用備註…"><button id="addNote" class="small">＋</button></div><div id="noteList"></div></div></section><button id="fab" class="fab">＋</button></main>
<div id="status" class="status"></div>
<div id="modal" class="modal hidden"><div class="sheet"><h3>新增共用行程</h3><div class="field"><label>日期</label><input id="evDate" type="date"></div><div class="field"><label>時間</label><div class="luggage-time" aria-label="行李箱密碼轉盤式時間選擇器">
<div class="wheel-caption">上下滑動數字，或點選上下箭頭調整時間</div>
<div class="wheel-row">
 <div class="wheel-unit"><div class="wheel-label">上午／下午</div><div class="wheel" id="wheelPeriod" data-wheel="period"></div></div>
 <div class="wheel-unit"><div class="wheel-label">小時</div><div class="wheel" id="wheelHour" data-wheel="hour"></div></div>
 <span class="wheel-colon">:</span>
 <div class="wheel-unit"><div class="wheel-label">分鐘</div><div class="wheel" id="wheelMinute" data-wheel="minute"></div></div>
</div>
<input id="evTime" type="hidden"><div class="wheel-preview" id="wheelPreview"></div>
</div></div><div class="field"><label>行程</label><input id="evTitle" placeholder="輸入行程名稱"></div><div class="field"><label>備註</label><textarea id="evNote" placeholder="地點、提醒事項…"></textarea></div><div id="saveError" role="alert" style="display:none;color:#a05b58;background:#f8e7e5;padding:10px;border-radius:10px;font-size:18px;margin-top:10px"></div><div class="actions"><button id="cancel" class="cancel">取消</button><button id="saveEv" class="primary">儲存</button></div></div></div>
<script>
/*
多人同步設定：
1. 將下方 API_URL 改成你的 Google Apps Script Web App /exec 網址。
2. 後端需支援：
   GET  ?action=list
   POST JSON {action:"add", type:"event|todo|note", ...}
   POST JSON {action:"delete", id:"..."}
回傳 JSON：{ok:true,items:[...]}
*/
const API_URL = 'https://script.google.com/macros/s/AKfycbyUksNx0tJZdPvvI8A41XfmlEIroOKkDZUDGsnBVabheJJPjL-59FTfmtif7LnYYgVu/exec';
const PASSWORD='4530';
let username='', userColor='#87988a', items=[], now=new Date(), view=new Date(now.getFullYear(),now.getMonth(),1), selected=fmt(now);
const $=s=>document.querySelector(s);
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeColor(c){return /^#[0-9a-fA-F]{6}$/.test(String(c||''))?c:'#87988a'}
function toast(t){let x=$('#status');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function configured(){return /^https:\/\/script\.google\.com\//.test(API_URL)}
// 使用 JSONP 與 Apps Script 溝通，避開 GitHub Pages 的跨來源 fetch 限制。
// 需搭配本次提供的新版 Apps Script 後端。
let requestNo=0;
function api(payload,method='POST'){
 if(!configured())return Promise.reject(new Error('尚未設定共用雲端網址'));
 const params=new URLSearchParams(payload||{action:'list'});
 if(payload && payload.date) params.set('date', String(payload.date).replace(/\//g,'-'));
 if(method==='GET')params.set('action','list');
 const cb='dailyTreeCB_'+(++requestNo)+'_'+Date.now();
 params.set('callback',cb);
 params.set('_',String(Date.now()));
 return new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  let finished=false;
  const timer=setTimeout(()=>done(new Error('連線逾時：請確認已部署新版 Apps Script，並允許所有人存取')),15000);
  function done(err,data){
   if(finished)return;
   finished=true;clearTimeout(timer);
   script.remove();delete window[cb];
   if(err)reject(err);else if(!data||!data.ok)reject(new Error((data&&data.error)||'伺服器回傳錯誤'));else resolve(data);
  }
  window[cb]=data=>done(null,data);
  script.onerror=()=>done(new Error('雲端連線失敗：請檢查 Apps Script 網址及部署權限'));
  script.src=API_URL+'?'+params.toString();
  document.head.appendChild(script);
 });
}
async function sync(){
 try{toast('同步中…');let j=await api(null,'GET');items=j.items||[];render();toast('已同步')}
 catch(e){render();toast(e.message)}
}
// 在此裝置記憶登入資料；共用裝置請勿啟用自動登入
const savedUserName = localStorage.getItem('dailyTreeUserName') || '';
if(savedUserName) $('#name').value = savedUserName;
const savedUserColor=localStorage.getItem('dailyTreeUserColor')||'#87988a';
$('#userColor').value=savedUserColor;
// 每次開啟都要求重新輸入密碼，清除舊版記憶的密碼。
localStorage.removeItem('dailyTreeSavedPassword');
$('#pass').value='';

$('#loginBtn').onclick=()=>{
 let n=$('#name').value.trim();
 if(!n){$('#err').textContent='請先輸入你的名稱';return}
 if($('#pass').value!==PASSWORD){$('#err').textContent='密碼不正確';return}
 localStorage.setItem('dailyTreeUserName', n);
 userColor=$('#userColor').value||'#87988a';
 localStorage.setItem('dailyTreeUserColor',userColor);
 username=n;
 $('#who').textContent='使用者：'+n;
 $('#login').classList.add('hidden');
 $('#app').classList.remove('hidden');
 sync();
};
function render(){
 $('#month').textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;let g=$('#grid');g.innerHTML='';
 let f=new Date(view.getFullYear(),view.getMonth(),1),s=new Date(f);s.setDate(1-f.getDay());
 for(let i=0;i<42;i++){
  let d=new Date(s);d.setDate(s.getDate()+i);let k=fmt(d),b=document.createElement('button');
  b.className='day'+(d.getDay()===0?' sunday':'')+(d.getDay()===6?' saturday':'')+(d.getMonth()!=view.getMonth()?' other':'')+(k===selected?' sel':'')+(k===fmt(now)?' now':'');
  let dayEvents=items.filter(x=>x.date===k&&x.type==='event').sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  let eventHtml='';
  if(dayEvents.length){
    const visible=dayEvents.slice(0,3).map(x=>{
      const time=x.time ? x.time+' ' : '';
      return `<span class="day-event" style="--event-color:${safeColor(x.color)}">${esc(time+x.title)}</span>`;
    }).join('');
    const more=dayEvents.length>3?`<span class="more-event">＋${dayEvents.length-3} 筆</span>`:'';
    eventHtml=`<span class="day-events">${visible}${more}</span>`;
  }
  b.innerHTML=`<span class="num">${d.getDate()}</span>${eventHtml}`;
  b.onclick=()=>{selected=k;if(d.getMonth()!=view.getMonth())view=new Date(d.getFullYear(),d.getMonth(),1);render()};
  g.appendChild(b)
 }
 renderDay();
}
function renderDay(){
 let d=new Date(selected+'T00:00:00');$('#date').textContent=`${d.getMonth()+1}/${d.getDate()}`;
 let ev=items.filter(x=>x.date===selected&&x.type==='event').sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 $('#events').innerHTML=ev.length?ev.map(card).join(''):'<div class="empty">這天還沒有共用行程</div>';
 let td=items.filter(x=>x.date===selected&&x.type==='todo');$('#todoList').innerHTML=td.length?td.map(card).join(''):'<div class="empty">這天還沒有共用待辦</div>';
 let nt=items.filter(x=>x.date===selected&&x.type==='note');$('#noteList').innerHTML=nt.length?nt.map(card).join(''):'<div class="empty">這天還沒有共用備註</div>';
}
function card(x){let title=x.type==='event'?`${esc(x.time||'全天')}　${esc(x.title)}`:esc(x.text);return `<div class="item" style="border-left-color:${safeColor(x.color)}"><div class="grow"><b>${title}</b>${x.note?`<div class="meta">${esc(x.note)}</div>`:''}<div class="meta">建立者：${esc(x.user||'未記錄')}</div></div><button class="del" onclick="removeItem('${String(x.id).replace(/'/g,"")}')">×</button></div>`}
window.removeItem=async id=>{if(!confirm('確定刪除這筆共用資料？所有人都會同步刪除。'))return;try{await api({action:'delete',id,user:username});await sync()}catch(e){toast(e.message)}};
async function add(type,obj){
 const result=await api({action:'add',type,date:selected,user:username,color:userColor,...obj});
 await sync();
 return result;
}
$('#addTodo').onclick=async()=>{let t=$('#todoText').value.trim();if(t){try{await add('todo',{text:t});$('#todoText').value=''}catch(e){alert('待辦儲存失敗：'+e.message)}}};
$('#addNote').onclick=async()=>{let t=$('#noteText').value.trim();if(t){try{await add('note',{text:t});$('#noteText').value=''}catch(e){alert('備註儲存失敗：'+e.message)}}};
// 行李箱式時間轉盤，儲存仍使用標準 HH:mm（24 小時制）
const wheelValues={period:['上午','下午'],hour:Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')),minute:Array.from({length:60},(_,i)=>String(i).padStart(2,'0'))};
const wheelState={period:0,hour:8,minute:0};
const wheelTimers={};
function updateWheelTime(){
 const hour12=wheelState.hour+1;
 const hour24=(hour12%12)+(wheelState.period===1?12:0);
 $('#evTime').value=String(hour24).padStart(2,'0')+':'+String(wheelState.minute).padStart(2,'0');
 $('#wheelPreview').textContent=wheelValues.period[wheelState.period]+' '+String(hour12).padStart(2,'0')+':'+wheelValues.minute[wheelState.minute];
 Object.keys(wheelValues).forEach(k=>document.querySelectorAll('#wheel'+k[0].toUpperCase()+k.slice(1)+' .wheel-option').forEach((el,i)=>el.classList.toggle('active',i===wheelState[k])));
}
function setWheel(k,index,animate=true){
 index=Math.max(0,Math.min(wheelValues[k].length-1,index));wheelState[k]=index;
 const el=$('#wheel'+k[0].toUpperCase()+k.slice(1));
 el.scrollTo({top:index*52,behavior:animate?'smooth':'instant'});
 updateWheelTime();
}
function initTimeWheels(){
 for(const k of Object.keys(wheelValues)){
  const el=$('#wheel'+k[0].toUpperCase()+k.slice(1));
  el.innerHTML='<div class="wheel-spacer"></div>'+wheelValues[k].map((v,i)=>'<div class="wheel-option" data-index="'+i+'">'+v+'</div>').join('')+'<div class="wheel-spacer"></div>';
  el.addEventListener('click',e=>{const item=e.target.closest('.wheel-option');if(item)setWheel(k,Number(item.dataset.index))});
  el.addEventListener('scroll',()=>{clearTimeout(wheelTimers[k]);wheelTimers[k]=setTimeout(()=>{const index=Math.round(el.scrollTop/52);setWheel(k,index,false)},95)},{passive:true});
 }
 const n=new Date();wheelState.period=n.getHours()>=12?1:0;wheelState.hour=(n.getHours()%12||12)-1;wheelState.minute=n.getMinutes();
 Object.keys(wheelValues).forEach(k=>setWheel(k,wheelState[k],false));
}
initTimeWheels();
$('#fab').onclick=()=>{$('#saveError').style.display='none';$('#evDate').value=selected;$('#evTitle').value='';$('#evNote').value='';const t=new Date();wheelState.period=t.getHours()>=12?1:0;wheelState.hour=(t.getHours()%12||12)-1;wheelState.minute=t.getMinutes();Object.keys(wheelValues).forEach(k=>setWheel(k,wheelState[k],false));$('#modal').classList.remove('hidden')};
$('#cancel').onclick=()=>$('#modal').classList.add('hidden');
$('#saveEv').onclick=async()=>{
 const date=$('#evDate').value,title=$('#evTitle').value.trim(),btn=$('#saveEv'),err=$('#saveError');
 if(!date||!title){err.textContent='請填寫日期及行程名稱';err.style.display='block';return}
 btn.disabled=true;btn.textContent='儲存中…';err.style.display='none';
 try{
  await api({action:'add',type:'event',date,user:username,color:userColor,title,time:$('#evTime').value,note:$('#evNote').value.trim()});
  selected=date;view=new Date(Number(date.slice(0,4)),Number(date.slice(5,7))-1,1);
  $('#modal').classList.add('hidden');await sync();toast('行程已儲存');
 }catch(e){
  err.textContent='儲存失敗：'+e.message+'。如仍顯示日期格式錯誤，請確認後端已部署最新版本。';
  err.style.display='block';
 }finally{btn.disabled=false;btn.textContent='儲存'}
};
$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('#today').onclick=()=>{selected=fmt(now);view=new Date(now.getFullYear(),now.getMonth(),1);render()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on')});
setInterval(()=>{if(username&&configured())sync()},30000);
render();
// 已登入過的個人裝置，重開時自動進入；清除網站資料即可重新輸入。

</script></body></html>
